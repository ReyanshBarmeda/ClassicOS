name: Classic OS ARM Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'assets/**'
      - 'package/**'
      - 'installer/**'
      - 'tests/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'Makefile'
      - 'CMakeLists.txt'
      - '.github/workflows/build-armhf.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'assets/**'
      - 'package/**'
      - 'installer/**'
      - 'tests/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'Makefile'
      - 'CMakeLists.txt'
      - '.github/workflows/build-armhf.yml'

permissions:
  contents: read

concurrency:
  group: build-armhf-${{ github.ref }}
  cancel-in-progress: true

env:
  # Highest GLIBC symbol version the PlayStation Classic can load (see BUILD_INSTRUCTIONS.md)
  PSC_MAX_GLIBC: "2.28"

jobs:
  build-armhf:
    name: Build armhf (Debian 10 container, glibc 2.28)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Lint launcher/boot scripts and boot menu JSON
        run: |
          status=0
          for f in $(git ls-files '*.sh' '*.cfg'); do
            if sh -n "$f"; then echo "ok   $f"; else echo "FAIL $f"; status=1; fi
          done
          python3 -m json.tool package/etc/boot_menu/boot_items/004_classic_os.json > /dev/null
          exit "$status"

      - name: Boot-script, supervisor and installer tests (Category 1, no hardware)
        run: sh tests/run_tests.sh

      - name: Build, package and verify in Debian 10 (glibc 2.28)
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e PSC_MAX_GLIBC \
            -v "$GITHUB_WORKSPACE":/src \
            -w /src \
            debian:buster \
            sh scripts/ci_build_buster.sh

      - name: Create installable release zip
        run: |
          short_sha="${GITHUB_SHA::7}"
          name="ClassicOS-ARMHF-${short_sha}"
          rm -rf stage && mkdir -p "stage/${name}" dist
          cp -R package "stage/${name}/payload"
          cp installer/install.sh installer/uninstall.sh "stage/${name}/"
          cp BUILD_INSTRUCTIONS.md "stage/${name}/"
          mkdir -p "stage/${name}/docs" && cp docs/BOOT_READINESS.md "stage/${name}/docs/"
          chmod +x "stage/${name}/install.sh" "stage/${name}/uninstall.sh"
          (cd stage && zip -qr "../dist/${name}.zip" "${name}")
          (cd dist && sha256sum "${name}.zip" > "${name}.zip.sha256" && cat "${name}.zip.sha256")
          unzip -l "dist/${name}.zip"

      - name: Installer dry run against the built payload
        run: |
          name="ClassicOS-ARMHF-${GITHUB_SHA::7}"
          usb="$(mktemp -d)"
          mkdir -p "${usb}/project_eris/etc/project_eris/FUNC"
          (cd "stage/${name}" && sh ./install.sh "${usb}" --dry-run)

      - name: Upload build package
        uses: actions/upload-artifact@v4
        with:
          name: ClassicOS-ARMHF-boot-ready
          path: dist/
          if-no-files-found: error
          retention-days: 30
