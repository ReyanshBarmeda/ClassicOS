name: Classic OS ARM Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-armhf:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enable ARMHF packages
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update

      - name: Install build tools and ARM libraries
        run: |
          sudo apt-get install -y \
            build-essential \
            make \
            file \
            binutils-arm-linux-gnueabihf \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            libsdl2-dev:armhf \
            libpng-dev:armhf \
            libsqlite3-dev:armhf

      - name: Build and package ARM executable
        run: |
          chmod +x scripts/build_armhf.sh
          ./scripts/build_armhf.sh make

      - name: Verify ARM executable
        run: |
          file package/opt/classic_os/classic_os
          arm-linux-gnueabihf-readelf -h package/opt/classic_os/classic_os
          arm-linux-gnueabihf-readelf -d package/opt/classic_os/classic_os

      - name: Upload build package
        uses: actions/upload-artifact@v4
        with:
          name: ClassicOS-ARMHF-candidate
          path: package/
          if-no-files-found: error
