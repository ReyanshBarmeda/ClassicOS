#===============================================================================
# Classic OS — Project Eris Primary Boot & Supervisor Configuration
# Location on USB: /media/project_eris/etc/project_eris/CFG/classic_os_boot.cfg
#===============================================================================

# 1 = Boot directly into Classic OS as the Primary Dashboard on power-on
# 0 = Boot into the original Project Eris Boot Menu (manual launch only)
CLASSIC_OS_PRIMARY_DASHBOARD="1"

# 1 = Also hook /media/project_eris/opt/emulationstation/launch.sh (backed up to
#     launch.sh.es_backup) so selecting EmulationStation in Boot Menu launches Classic OS
# 0 = Leave original EmulationStation launch.sh untouched
CLASSIC_OS_HOOK_EMULATIONSTATION="1"

# Default supervisor target written to /tmp/launchfilecommand when Classic OS exits
# Supported values: "launch_bootmenu", "launch_stockui", "launch_retroarch_standalone"
CLASSIC_OS_DEFAULT_EXIT_TARGET="launch_bootmenu"

# Crash-loop guard: minimum uptime (seconds) on cold auto-boot before a non-zero exit
# triggers automatic fallback to the Project Eris Boot Menu
CLASSIC_OS_MIN_UPTIME_SEC="2"
