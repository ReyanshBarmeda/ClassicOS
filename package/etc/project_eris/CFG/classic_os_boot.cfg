#===============================================================================
# Classic OS — Project Eris Primary Boot & Supervisor Configuration
# Location on USB: /media/project_eris/etc/project_eris/CFG/classic_os_boot.cfg
#
# Shipped with auto-boot OFF: the first run should be started from the Project Eris
# Boot Menu / Stock UI tile. Once that works on your console, enable auto-boot with
#   sh /media/project_eris/opt/classic_os/bootctl.sh --enable-primary
# (or from the Exit menu inside Classic OS).
#===============================================================================

# 1 = Boot straight into Classic OS on power-on
# 0 = Original Project Eris Boot Menu (Classic OS launched manually only)
CLASSIC_OS_PRIMARY_DASHBOARD="0"

# 1 = Wrap /media/project_eris/opt/emulationstation/launch.sh (original saved as
#     launch.sh.es_backup) so choosing EmulationStation starts Classic OS
# 0 = Leave EmulationStation untouched
CLASSIC_OS_HOOK_EMULATIONSTATION="0"

# Supervisor token handed to Project Eris when Classic OS exits normally
# Supported values: "launch_bootmenu", "launch_stockui", "launch_retroarch_standalone"
CLASSIC_OS_DEFAULT_EXIT_TARGET="launch_bootmenu"

# Crash guard: Classic OS exiting sooner than this many seconds (any exit code) counts as a crash
CLASSIC_OS_MIN_UPTIME_SEC="2"

# Crash-loop guard: after this many consecutive failed boots auto-boot is switched off
# and the Project Eris Boot Menu becomes the default again
CLASSIC_OS_MAX_CRASHES="3"

# Hang guard: seconds Classic OS may take to present its first frame before it is stopped
CLASSIC_OS_READY_TIMEOUT_SEC="30"

# Force an SDL2 video backend (e.g. wayland, kmsdrm). Empty = auto-detect.
CLASSIC_OS_VIDEO_DRIVER=""
